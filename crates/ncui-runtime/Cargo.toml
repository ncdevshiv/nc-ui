[package]
name = "ncui-runtime"
description = "Runtime composition: wires core subsystems, serves the agent-facing JSON-RPC API, and reports health."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Enables global shortcuts: the manifest declares them and the application holds them while
# it runs. Off by default for the same reason the crate underneath gates them.
global-shortcuts = ["ncui-native/global-hotkeys"]
# Enables native file, save and folder dialogs. Off by default for the same reason the crate
# underneath gates them: a modal dialog blocks on a person, so gating it keeps the default
# build and the headless gate exactly as they are. When this feature is off but a page holds
# `Capability::Dialog`, the dialog command still registers and honestly reports
# `dialog_unavailable` rather than claiming success — the same shape the notification command
# reports on a host with no notifier. The permission, option and path rules are plain Rust and
# run either way.
dialogs = ["ncui-native/dialogs"]
# Enables manifest-declared native menu bars in the real window host.
native-menu = ["ncui-webview-wry/native-menu"]

default = []
# The real window host. Off by default so the runtime compiles and its whole test suite
# runs on a machine with no display and no graphics stack; a release build turns it on.
# It carries the global-shortcut registration, because a desktop application with a
# window host is exactly the application that declares a shortcut: the counter example
# does, and the documented `ncui run` command must be able to run it rather than refuse
# the manifest for want of the feature.
# ADR-012 records the `wry`/`tao` dependency as a deliberate exception, confined to
# `ncui-webview-wry`.
wry-host = [
    "dep:ncui-webview-wry",
    "ncui-webview-wry/wry-engine",
    "ncui-webview-wry/parented-dialogs",
    "global-shortcuts",
    "native-menu",
    "dialogs",
]
# Enables the application tray icon. Implies the window host, because a tray icon belongs
# to the engine's event loop and there is no tray without one.
tray-icon = ["wry-host", "ncui-webview-wry/tray-icon"]
# The GPU island surface: the route a page fetches a rendered island from. Pulls in the renderer
# and its `wgpu` binding, which is why it is off by default — a build with no graphics stack must
# still compile and run.
gpu-islands = [
    "dep:ncui-gpu-renderer",
    "ncui-gpu-renderer/wgpu-device",
    "ncui-gpu-renderer/text-shaping",
]
# The GPUI native window host. Off by default for the same reason as the wry host: it is a
# platform dependency chain, and a build with no display stack must still compile and run.
# The runtime never names the crate outside this feature — a GPUI host enters through the
# host-neutral `Runtime::with_host_factory` like any other factory.
gpui-host = ["dep:ncui-gpui", "ncui-gpui/gpui-engine"]

[dependencies]
ncui-core = { workspace = true }
ncui-app = { workspace = true }
ncui-native = { workspace = true }
ncui-abi = { workspace = true }
ncui-component = { workspace = true }
ncui-webview = { workspace = true }
ncui-webview-child = { workspace = true }
ncui-webview-wry = { workspace = true, optional = true }
ncui-gpu = { workspace = true }
ncui-video-surface = { path = "../ncui-video-surface" }
ncui-audio-output = { path = "../ncui-audio-output" }
ncui-sidecar = { path = "../ncui-sidecar" }
# Optional: only a build that links the GPUI native window host needs it.
ncui-gpui = { workspace = true, optional = true }
# Optional: only the island surface draws anything.
ncui-gpu-renderer = { workspace = true, optional = true }
ncui-a11y = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ncui-ipc = { workspace = true }
ncui-state = { workspace = true }
ncui-scheduler = { workspace = true }
ncui-security = { workspace = true }
ncui-observability = { workspace = true }
ncui-workers = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The coexistence test drives both real hosts in one process: gpui with its test support
# for the provider it registers, and the same pinning ncui-gpui carries so feature
# unification keeps one gpui in the graph.
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
ncui-gpui = { workspace = true, features = ["gpui-engine"] }
ncui-webview-wry = { workspace = true, features = ["wry-engine"] }
# The video-surface compositing proof presents into a real host window and reads
# the composited screen back.
ncui-video-surface = { path = "../ncui-video-surface" }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }
