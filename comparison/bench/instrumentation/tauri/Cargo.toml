[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
default-run = "app"
edition = "2021"
rust-version = "1.77"

# Upgraded from Tauri 1.2 to Tauri 2 (current) for the comparison's Tauri 2 leg. The comparison
# harness applies this upgrade to the cloned upstream before building, so the framework version the
# incumbent is measured on is the current one the project compares against.
#
# The versions are pinned exactly, to the same minor as the `@tauri-apps/cli` pin in this
# overlay's package.json: the Tauri CLI refuses to build when the npm package and the Rust
# crate are not on the same major/minor release, and a floating `2` on either side lets the
# two drift apart as new releases land.

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "=2.12.5", features = [] }
