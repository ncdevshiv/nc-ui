[package]
name = "ncui-webview-wry"
description = "WebView host binding: implements WebViewBackend over wry + tao on Windows, with a feature-gated headless fallback."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["NC-UI Contributors"]

[lints]
workspace = true

[features]
default = []
# Enables the real wry/tao engine binding. Enable on a machine/host that can build it;
# Linux needs webkit2gtk-dev. Off by default so the crate always compiles.
wry-engine = ["dep:wry", "dep:tao"]
[dependencies]
ncui-webview = { workspace = true }
ncui-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

wry = { version = "0.57", optional = true, default-features = false, features = ["os-webview"] }
tao = { version = "0.33", optional = true, default-features = false, features = ["rwh_06"] }
