[package]
name = "ncui-gpu-renderer"
description = "wgpu-backed GPU renderer for GPU islands: device, queue, surface and render pass ownership."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors = ["NC-UI Contributors"]

[lints]
workspace = true

[features]
# On by default: "GPU-driven" that is compiled out is an aspiration, not an implementation.
# wgpu compiles on any machine — it is pure Rust over the system driver — and a machine
# without a hardware GPU is served by the software fallback adapter (WARP/llvmpipe) rather
# than by compiling the renderer out. A minimal consumer that genuinely ships no renderer
# opts out with `default-features = false` and says so in its own feature documentation.
default = ["wgpu-device", "text-shaping"]
# The real wgpu device binding.
wgpu-device = ["dep:wgpu"]
# The text layout path; the layout policy itself is pure and is tested without it.
text-shaping = ["dep:rustybuzz"]

[dependencies]
ncui-core = { workspace = true }
ncui-gpu = { workspace = true }

wgpu = { workspace = true, optional = true }
rustybuzz = { workspace = true, optional = true }

[dev-dependencies]
# Window surface tests create a real window on a machine with a display; the adapter
# layer owns the window, but the renderer's primitive is exercised against it here.
tao = { version = "0.33", default-features = false, features = ["rwh_06"] }
